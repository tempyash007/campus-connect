# ============================================================
# compose.yaml – Microservices Stack with API Gateway (Lab 7)
# Web Services & SOA Laboratory – DA-IICT
# ============================================================

services:

  # ── API Gateway (Single Entry Point) ─────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"   # ONLY Gateway is exposed externally
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - campus-network
    restart: on-failure

  # ── User Service (Internal Only) ─────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    expose:
      - "3001"        # Internal container port; not exposed to host
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/user_db
    depends_on:
      - mongodb
    networks:
      - campus-network
    restart: on-failure

  # ── Product Service (Internal Only) ──────────────────────
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    expose:
      - "3002"        # Internal container port; not exposed to host
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/product_db
    depends_on:
      - mongodb
    networks:
      - campus-network
    restart: on-failure

  # ── Order Service (Internal Only) ────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    expose:
      - "3003"        # Internal container port; not exposed to host
    environment:
      PORT: 3003
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      MONGODB_URI: mongodb://mongodb:27017/order_db
    depends_on:
      - user-service
      - product-service
      - mongodb
    networks:
      - campus-network
    restart: on-failure

  # ── MongoDB Database Service ──────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - campus-mongo-data:/data/db
    networks:
      - campus-network

# ── Shared Docker Network ───────────────────────────────────
networks:
  campus-network:
    driver: bridge

# ── Persistent Storage Volume ───────────────────────────────
volumes:
  campus-mongo-data:
